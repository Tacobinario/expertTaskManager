<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <title>SuperExpertTaskManager</title>
</head>
<body>

    <h1>Por Fin! EL Multifuncional Experto Super Manejador de Tareas! Agrega una YAAA!!! </h1>
    <h2>Agregar Nueva Tarea</h2>

<form action="/add" method="POST">
    <div class="form-container">
    <input type="text" name="title" placeholder="Título de la tarea" required>
    <textarea name="description" placeholder="Descripción"></textarea>
    <button type="submit">Agregar Tarea</button>
</div>

</form>

    {% for task in tasks %}
        <li>
            <strong>{{ task.title }}</strong>: {{ task.description }}
            {% if task.completed %}
                ✔ Completada
            {% else %}
                ❌ Pendiente
            {% endif %}
            <a href="/complete/{{ task.id }}">   ✔ Marcar completada</a>
            <a href="/delete/{{ task.id }}" style="color: red;">    🗑 Borrar</a>
        </li>

    {% endfor %}
</body>
</html>
